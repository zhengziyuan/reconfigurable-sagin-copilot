name: Verify and Deploy Smoke Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e './packages/rsagin-core[test]' -e ./apps/api
      - run: python -m pytest packages/rsagin-core/tests apps/api/tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web build
  containers:
    runs-on: ubuntu-latest
    needs: [engine, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verify browser-to-API proxy and persisted simulation
        run: |
          curl --fail http://127.0.0.1:8080/health
          curl --fail http://127.0.0.1:8080/ >/dev/null
          python scripts/container_smoke.py
      - name: Service logs
        if: always()
        run: docker compose logs --tail 100
      - name: Stop containers
        if: always()
        run: docker compose down
