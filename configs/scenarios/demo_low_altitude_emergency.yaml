  polygon:
    - [120.1200, 30.2500]
    - [120.1440, 30.2520]
    - [120.1525, 30.2660]
    - [120.1460, 30.2810]
    - [120.1215, 30.2790]
    - [120.1100, 30.2660]
  terrain: flat
  area_hint_km2: 3.1

grid:
  type: rectangular_hex_proxy
  nx: 20
  ny: 16
  user_height_m: 1.5
  target_height_m: 10.0
  channel_scenario: uma
  urban_clutter_density: 0.52
  weather:
    temperature_c: 29
    pressure_hpa: 1006
    water_vapor_density_g_m3: 12.5
    rain_rate_mm_h: 18
    rain_height_km: 4.8
    cloud_liquid_water_kg_m2: 0.18
  hotspot:
    lat: 30.265
    lon: 120.142
    radius_m: 650
    weight_boost: 1.8
  demand_hotspots:
    - id: command_center
      center: [30.2650, 120.1420]
      radius_m: 650
      weight: 1.8
    - id: south_gate
      center: [30.2580, 120.1325]
      radius_m: 480
      weight: 1.4
  shadow_zones:
