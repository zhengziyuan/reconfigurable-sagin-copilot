      center: [30.2585, 120.1330]
      lat: 30.2585
      lon: 120.1330
      radius_m: 760
      loss_db: 24
      affected_types: [ground_bs, ground_station]
    - id: eastern_warehouse_blockage
      center: [30.2680, 120.1460]
      lat: 30.2680
      lon: 120.1460
      radius_m: 520
      loss_db: 16
      affected_types: [ground_bs]

time:
