    weight: 0.25
  sensing:
    min_score: 0.55
    weight: 0.2
  cost:
    max_budget: 36
    weight: 0.15

optimization:
  solver: greedy_fast
  problem_template: robust_isac_reconfigurable_planning
  budget:
    max_total_cost: 36
    max_ris: 2
    max_mis: 1
    max_uav: 1
    max_ma: 1
  objective:
    coverage_weight: 0.30
    rate_weight: 0.25
    localization_weight: 0.22
    sensing_weight: 0.18
    cost_weight: 0.05
